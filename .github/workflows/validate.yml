name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: recipes.json against the schema, docs consistency
        run: python tools/validate.py
      - name: vendored recipes against their canonical recipe.json
        run: python tools/check_drift.py
